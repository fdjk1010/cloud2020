#nacos配置
server:
  port: 3377

spring:
  application:
    name: nacos-config-client
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848 #nacos服务注册中心地址
      config:
        server-addr: localhost:8848 #nacos服务配置中心地址
        file-extension: yaml #指定对应nacos的yaml格式的配置
#        group: TEST_GROUP #对应nacos的Group名
        group: DEV_GROUP #对应nacos的Group名
        namespace: 361d9311-041d-4307-97a7-aae8fabe825f #dev命名空间id

#${spring.application.yml.name}-${spring.profile.active}.${spring.cloud.nacos.config.file-extension}
