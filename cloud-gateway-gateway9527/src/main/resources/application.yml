server:
  port: 9527

spring:
  application:
    name: cloud-gateway
  cloud:
    gateway:
      routes:   #路由
        - id: payment_routh   #payment_route #路由的id，没有固定规定但要求唯一，建议配合服务名
#          uri: http://localhost:8001  #匹配后提供服务的路由地址
          uri: lb://CLOUD-PAYMENT-SERVICE	  #匹配后提供服务的路由地址
          filters:
            - AddRequestParameter=X-Request-Id,1024 #过滤器工厂会在匹配的请求头加上一对请求头，名称为X-Request-Id值为1024
          predicates:
            - Path=/payment/get/**  #断言，路径相同匹配的进行路由
            #设置多少时间以后才生效 After多少时间之后生效，Before多少时间之前生效，Between多少时间之间生效
            - After=2021-04-16T15:55:57.310+08:00[Asia/Shanghai]
#            - Before=2021-04-16T15:55:57.310+08:00[Asia/Shanghai]
#            - Between=2021-04-16T15:55:57.310+08:00[Asia/Shanghai],2021-04-16T16:55:57.310+08:00[Asia/Shanghai]

#            通过cmd中curl带cookie访问方法
#            curl http://localhost:9527/payment/get/31 --cookie "username=zzyy"
#            - Cookie=username,zzyy  #key,value(正则表达式)
            - Header=X-Request-Id,\d+ #请求头要有X-Request-Id属性并且值为整数的正则表达式


        - id: payment_routh2   #payment_route2 #路由的id，没有固定规定但要求唯一，建议配合服务名
#          uri: http://localhost:8001  #匹配后提供服务的路由地址
          uri: lb://CLOUD-PAYMENT-SERVICE      #匹配后提供服务的路由地址
          predicates:
            - Path=/payment/lb/**  #断言，路径相同匹配的进行路由
      discovery:
        locator:
          enabled: true  #开启从注册中心动态创建路由的功能，利用微服务名进行路由

eureka:
  instance:
    hostname: cloud-gateway-service
  client:
    #表示是否将自己注册进EurekaServer默认为true
    register-with-eureka: true
    #是否从EurekasServer抓取已有的注册信息，默认为true。单节点无所谓，集群必须设置为true才能配合ribbon使用负载均衡
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:7001/eureka
      #集群版
#      defaultZone: http://eureka7001.com:7001/eureka/,http://eureka7002.com:7002/eureka/